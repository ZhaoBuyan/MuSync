name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MuSync.sln

      - name: Build (Debug, warnings as errors)
        run: dotnet build MuSync.sln -c Debug --no-restore

      - name: Run tests
        run: dotnet test MuSync.sln -c Debug --no-build

      - name: Publish Release (self-contained, single file)
        run: dotnet publish MuSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:MuSyncEdition=full -o publish

      - name: Publish Lite (framework-dependent, single file)
        run: dotnet publish MuSync.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:MuSyncEdition=lite -o publish-lite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuSync-win-x64
          path: publish/
          if-no-files-found: error

      - name: Upload lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuSync-win-x64-lite
          path: publish-lite/
          if-no-files-found: error

      - name: Publish Setup payload (self-contained, edition=setup)
        run: dotnet publish MuSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:MuSyncEdition=setup -o setup-payload

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path MuSync.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe（Inno Setup 安装失败？）" }
          & $iscc "/DAppVersion=$version" "installer\MuSync.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuSync-win-x64-setup
          path: dist-setup/
          if-no-files-found: error

  release:
    name: Create GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MuSync-win-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: MuSync-win-x64-lite
          path: dist-lite

      - uses: actions/download-artifact@v4
        with:
          name: MuSync-win-x64-setup
          path: dist-setup

      - name: Merge lite & installer into dist
        run: |
          mv dist-lite/MuSync.exe dist/MuSync-lite.exe
          mv dist-setup/MuSync-Setup.exe dist/MuSync-Setup.exe
          # 许可证随包：Release 资产里也要有（只下 exe 的人也能在同一页拿到）
          cp LICENSE THIRD-PARTY-NOTICES.md dist/

      - name: Package browser extension
        run: |
          # 扩展单独出一个 zip：不然用户得克隆仓库才能「加载解压缩的扩展」
          ( cd extension && zip -qr ../dist/MuSync-Browser-Extension.zip . )
          ls -l dist/MuSync-Browser-Extension.zip

      - name: Verify tag matches csproj version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' MuSync.csproj | head -1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag ($TAG) 与 csproj 版本 ($VERSION) 不一致"
            exit 1
          fi
          echo "版本一致: v$VERSION"

      - name: Create Release
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 从 CHANGELOG.md 提取当前版本段落作为 Release notes；找不到则用一行标题兜底
          awk -v tag="$TAG" '
            BEGIN { inSec = 0 }
            /^## \[/ { if (inSec) exit; if ($0 ~ "^## \\[" tag "\\]") inSec = 1; next }
            inSec { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "MuSync $GITHUB_REF_NAME" > notes.md
          fi

          # 发布资产的 SHA-256：既写进 Release notes（方便人工核对），也单独出一个 SHA256SUMS.txt 资产。
          # 它证明的是"文件与发布时一致"，不是"来源可信"：摘要和文件走同一条 TLS 连接，
          # 要密码学意义上的来源保证只能靠代码签名（发行包目前未签名，程序会如实提示）。
          # ⚠️ 逐个数、用 cut 只取摘要：Windows 上的 sha256sum 会输出 "hash *文件名"（二进制标记），
          #    直接重定向会把星号带进 SHA256SUMS.txt 和 Release 表格里。
          (
            cd dist
            for f in MuSync.exe MuSync-lite.exe MuSync-Setup.exe MuSync-Browser-Extension.zip; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
            done > SHA256SUMS.txt
          )
          {
            echo ""
            echo "---"
            echo ""
            echo "### 校验下载（SHA-256）"
            echo ""
            echo "下载后可在本地核对文件是否与发布时一致："
            echo ""
            echo '```powershell'
            echo 'Get-FileHash .\MuSync.exe -Algorithm SHA256'
            echo '```'
            echo ""
            echo "| 文件 | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum name; do
              printf '| `%s` | `%s` |\n' "$name" "$sum"
            done < dist/SHA256SUMS.txt
          } >> notes.md

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MuSync $GITHUB_REF_NAME" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
