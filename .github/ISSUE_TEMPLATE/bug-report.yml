name: Bug 反馈 / Bug report
description: 状态、连接、播放器或界面异常 / Status, connection, player or UI problems
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        可使用中文或英文填写。You may write in Chinese or English.
        设置 → 诊断 → 复制诊断信息，可帮助定位问题。
        Settings → Diagnostics → Copy diagnostics helps us investigate.
        请先检查并遮盖日志/截图里的个人信息。不要公开上传 Dump、令牌或完整配置。
        Review and redact personal data in logs/screenshots. Do not post dumps, tokens or full configuration files publicly.
        持续卡死可先保存 Dump；通过 [作者主页](https://github.com/ZhaoBuyan) 的邮箱联系，大文件先协商私下分享方式。
        For persistent hangs, save a dump if possible. Contact the email on the [author profile](https://github.com/ZhaoBuyan) to arrange private sharing of large files.
  - type: textarea
    id: what
    attributes:
      label: 问题与预期 / Problem and expected behavior
      description: 实际发生什么？你期望什么？ / What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 尽量说明操作顺序、出现频率和是否能稳定复现。 / Include the sequence, frequency and whether it happens consistently.
    validations:
      required: false
  - type: dropdown
    id: source
    attributes:
      label: 涉及功能 / Affected area
      options:
        - 不确定 / Not sure
        - 网易云音乐 / NetEase Cloud Music
        - QQ 音乐 / QQ Music
        - 洛雪 / LX Music
        - 酷狗音乐 / KuGou Music
        - 千千静听 / TTPlayer
        - 浏览器媒体或扩展 / Browser media or extension
        - 程序同步 / App sync
        - 自定义数据源 / Custom data sources
        - Steam 登录或连接 / Steam sign-in or connection
        - 界面、主题或页面切换 / UI, themes or page switching
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MuSync 版本 / MuSync version
      description: 从设置 → 关于查看完整版本号。 / Copy the full version from Settings → About.
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: 运行版本 / Build edition
      options:
        - 完整版 / Full (self-contained)
        - 轻量版 / Lite (.NET required)
        - 自行构建 / Self-built
        - 不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息 / Diagnostics
      description: 设置 → 诊断 → 复制诊断信息；粘贴前检查个人信息。 / Settings → Diagnostics → Copy diagnostics; review personal data before posting.
      render: text
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: 日志、截图或录屏 / Logs, screenshots or recording
      description: 日志文件夹在诊断页；界面问题请尽量提供缩放比例、主题和切页顺序。不要附公开 Dump。 / Open logs from Diagnostics. For UI problems, include display scaling, theme and page-switch sequence. No public dumps.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 检查 / Checklist
      options:
        - label: 已搜索现有 Issue / I searched existing issues
          required: false
        - label: 已检查并遮盖敏感信息 / I reviewed and redacted sensitive data
          required: false
