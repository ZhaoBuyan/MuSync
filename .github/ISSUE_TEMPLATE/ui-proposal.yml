name: 界面建议 / UI suggestion
description: 布局、主题、可读性或交互建议 / Layout, themes, readability or interaction
title: "[UI] "
labels: ["ui"]
body:
  - type: markdown
    attributes:
      value: |
        可使用中文或英文。描述具体位置，或附一张草图即可。
        Chinese and English are welcome. Describe the specific area or attach a sketch.
        当前方向：主窗口内切页、统一主题、轻量绘制、性能与键盘可达性；保留现有功能入口。
        Current direction: in-window page switching, consistent themes, lightweight rendering, performance and keyboard accessibility; keep existing feature access.
  - type: dropdown
    id: area
    attributes:
      label: 涉及界面 / Affected area
      options:
        - 主界面 / Overview
        - 设置侧栏或页面切换 / Settings sidebar or page switching
        - 同步页 / Sync page
        - 显示与主题 / Display and themes
        - 程序页 / Apps page
        - 数据源页 / Data sources page
        - 诊断或关于 / Diagnostics or About
        - 积木编辑器 / Block editor
        - 登录窗口 / Sign-in dialog
        - 托盘菜单 / Tray menu
        - 其他或全局 / Other or global
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前问题 / Current problem
      description: 说明具体位置和使用影响；抖动请提供出现时机。 / Describe the location and impact; for flicker, explain when it occurs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改进建议 / Proposed improvement
      description: 可以描述效果、配色或布局，不要求代码。 / Describe behavior, colors or layout; code is not required.
    validations:
      required: false
  - type: textarea
    id: mockup
    attributes:
      label: 草图、截图或录屏 / Sketch, screenshot or recording
      description: 可直接粘贴图片；请遮盖个人信息。 / Paste images directly; redact personal information.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 补充 / Additional information
      options:
        - label: 保留现有功能入口 / Existing feature access is preserved
          required: false
        - label: 愿意提交实现 PR / I can contribute an implementation PR
          required: false
